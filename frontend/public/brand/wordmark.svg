<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 64" role="img" aria-label="Hindsight">
  <!-- Set in Archivo 700 at 125% width. Rendered live on the site, where
       next/font self-hosts the family; this file is the portable reference. -->
  <text x="0" y="42"
        font-family="Archivo, 'Archivo Expanded', system-ui, sans-serif"
        font-weight="700" font-size="46" font-stretch="125%"
        letter-spacing="-0.02em" fill="currentColor">HINDSIGHT</text>
  <!-- A hairline that breaks under SIGHT: the window opening over the part
       of the word that does the looking. -->
  <path d="M0 55 H196" stroke="currentColor" stroke-width="2" opacity="0.35"/>
  <path d="M232 55 H436" stroke="currentColor" stroke-width="2" opacity="0.35"/>
</svg>

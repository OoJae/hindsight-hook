[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer_runs = 50
via_ir = false
optimizer = true
ffi = true

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
unichain = "${UNICHAIN_RPC_URL}"
